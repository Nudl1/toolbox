<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toolbox</title>
<link rel="stylesheet" href="shared/theme.css">
<style>
  .homepage {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 20px 60px;
  }

  .top-bar {
    width: 100%;
    display: flex;
    justify-content: flex-end;
    padding: 16px 0;
  }

  .hero {
    text-align: center;
    margin: 60px 0 48px;
  }

  .hero h1 {
    font-size: 20px;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: 1px;
    margin-bottom: 6px;
  }

  .hero p {
    font-size: 12px;
    color: var(--text-muted);
  }

  .tool-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
    max-width: 820px;
    width: 100%;
  }

  .tool-card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px 20px;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
    display: block;
  }

  .tool-card:hover {
    border-color: var(--accent);
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  }

  .tool-icon {
    margin-bottom: 14px;
  }

  .tool-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 4px;
  }

  .tool-desc {
    font-size: 11px;
    color: var(--text-secondary);
    line-height: 1.5;
  }

  @media (max-width: 600px) {
    .hero { margin: 40px 0 32px; }
  }
</style>
</head>
<body>

<div class="homepage">
  <div class="top-bar">
    <button class="theme-btn" id="themeBtn">Light</button>
  </div>

  <div class="hero">
    <h1>TOOLBOX</h1>
  </div>

  <div class="tool-grid">
    <a href="tools/log-colorer/index.html" class="tool-card">
      <div class="tool-icon">
        <svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="4" width="28" height="24" rx="3" fill="none" stroke="var(--border)" stroke-width="1.5"/>
          <line x1="6" y1="10" x2="14" y2="10" stroke="#58a6ff" stroke-width="2" stroke-linecap="round"/>
          <line x1="16" y1="10" x2="20" y2="10" stroke="#3fb950" stroke-width="2" stroke-linecap="round"/>
          <line x1="6" y1="15" x2="10" y2="15" stroke="#f85149" stroke-width="2" stroke-linecap="round"/>
          <line x1="12" y1="15" x2="22" y2="15" stroke="#d29922" stroke-width="2" stroke-linecap="round"/>
          <line x1="6" y1="20" x2="18" y2="20" stroke="#3fb950" stroke-width="2" stroke-linecap="round"/>
          <line x1="20" y1="20" x2="26" y2="20" stroke="#bc8cff" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="tool-name">REST Log Colorer</div>
      <div class="tool-desc">Paste JSON API logs, get color-coded, filterable, expandable output.</div>
    </a>
  </div>
</div>

<script src="shared/theme.js"></script>
<script>Theme.init();</script>
</body>
</html>
